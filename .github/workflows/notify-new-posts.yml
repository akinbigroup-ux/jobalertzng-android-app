
name: JobAlertzNg New Post Notifications

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-subscribers:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase Admin
        run: npm install firebase-admin

      - name: Check Blogger and send notifications
        run: node scripts/notify-new-posts.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          APP_URL: ${{ vars.APP_URL }}
